name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint --strict

      - name: Verify SwiftLint version
        run: swiftlint version

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Set up module repositories
        run: |
          mkdir -p Modules
          git clone --depth 1 https://github.com/danieljustus/symaira-scope.git /tmp/symscope
          rm -f Modules/symscope-client
          ln -sf /tmp/symscope/client Modules/symscope-client
          git clone --depth 1 https://github.com/danieljustus/symaira-seek.git /tmp/symseek
          rm -f Modules/symseek-client
          ln -sf /tmp/symseek/client Modules/symseek-client

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip -o /tmp/xcodegen.zip
            unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
            export PATH="/tmp/xcodegen/xcodegen/bin:$PATH"
          fi
          xcodegen generate

      - name: Build
        run: xcodebuild build -project SymairaHub.xcodeproj -scheme SymairaHub -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Set up module repositories
        run: |
          mkdir -p Modules
          git clone --depth 1 https://github.com/danieljustus/symaira-scope.git /tmp/symscope
          rm -f Modules/symscope-client
          ln -sf /tmp/symscope/client Modules/symscope-client
          git clone --depth 1 https://github.com/danieljustus/symaira-seek.git /tmp/symseek
          rm -f Modules/symseek-client
          ln -sf /tmp/symseek/client Modules/symseek-client

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip -o /tmp/xcodegen.zip
            unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
            export PATH="/tmp/xcodegen/xcodegen/bin:$PATH"
          fi
          xcodegen generate

      - name: Test
        run: xcodebuild test -project SymairaHub.xcodeproj -scheme SymairaHub -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
