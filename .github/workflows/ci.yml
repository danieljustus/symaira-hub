name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up module repositories
        run: |
          git clone --depth 1 https://github.com/danieljustus/symaira-scope.git /tmp/symscope
          rm -f Modules/symscope-client
          ln -sf /tmp/symscope/client Modules/symscope-client
          git clone --depth 1 https://github.com/danieljustus/symaira-seek.git /tmp/symseek
          rm -f Modules/symseek-client
          ln -sf /tmp/symseek/client Modules/symseek-client

      - name: Generate Xcode project
        run: mkdir -p Modules && xcodegen generate

      - name: Run SwiftLint
        run: /opt/homebrew/bin/swiftlint --strict

      - name: Verify SwiftLint version
        run: /opt/homebrew/bin/swiftlint version

  build:
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up module repositories
        run: |
          git clone --depth 1 https://github.com/danieljustus/symaira-scope.git /tmp/symscope
          rm -f Modules/symscope-client
          ln -sf /tmp/symscope/client Modules/symscope-client
          git clone --depth 1 https://github.com/danieljustus/symaira-seek.git /tmp/symseek
          rm -f Modules/symseek-client
          ln -sf /tmp/symseek/client Modules/symseek-client

      - name: Generate Xcode project
        run: mkdir -p Modules && xcodegen generate

      - name: Build
        run: xcodebuild -project SymairaHub.xcodeproj -scheme SymairaHub build
