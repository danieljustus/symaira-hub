name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly on Monday 06:00 UTC

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: autobuild
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up module repositories
        if: matrix.language == 'swift'
        run: |
          mkdir -p Modules
          git clone --depth 1 https://github.com/danieljustus/symaira-scope.git /tmp/symscope
          rm -f Modules/symscope-client
          ln -sf /tmp/symscope/client Modules/symscope-client
          git clone --depth 1 https://github.com/danieljustus/symaira-seek.git /tmp/symseek
          rm -f Modules/symseek-client
          ln -sf /tmp/symseek/client Modules/symseek-client

      - name: Generate Xcode project
        if: matrix.language == 'swift'
        run: |
          brew install xcodegen 2>/dev/null || brew upgrade xcodegen 2>/dev/null || true
          xcodegen generate

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
