name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-release:
    name: macOS App Release
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        id: signing
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "::warning::CERTIFICATE_P12 secret is not set. Building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          CERT_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -oE '"Developer ID Application: [^"]+"' | head -1 | tr -d '"')
          if [ -z "$CERT_IDENTITY" ]; then
            echo "::warning::Could not resolve Developer ID Application identity; export may fail."
            CERT_IDENTITY="Developer ID Application"
          fi
          echo "CERT_IDENTITY=$CERT_IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip -o /tmp/xcodegen.zip
            unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
            export PATH="/tmp/xcodegen/xcodegen/bin:$PATH"
          fi
          xcodegen generate

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -project SymairaHub.xcodeproj \
            -scheme SymairaHub \
            -resolvePackageDependencies

      - name: Build archive (signed)
        if: steps.signing.outputs.signed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          xcodebuild archive \
            -project SymairaHub.xcodeproj \
            -scheme SymairaHub \
            -archivePath build/release/SymairaHub.xcarchive \
            -configuration Release \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES

      - name: Export archive (signed)
        if: steps.signing.outputs.signed == 'true'
        run: |
          cat > build/release/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>${CERT_IDENTITY}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/release/SymairaHub.xcarchive \
            -exportOptionsPlist build/release/ExportOptions.plist \
            -exportPath build/release/export

      - name: Build (unsigned)
        if: steps.signing.outputs.signed == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          xcodebuild build \
            -project SymairaHub.xcodeproj \
            -scheme SymairaHub \
            -configuration Release \
            -derivedDataPath build/release/DerivedData \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH=$(find build/release/DerivedData -name "SymairaHub.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::SymairaHub.app not found in DerivedData"
            exit 1
          fi
          mkdir -p build/release/export
          cp -R "$APP_PATH" build/release/export/

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
        run: |
          APP_PATH=$(find build/release/export -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found for notarization."
            exit 1
          fi
          if [ -z "${NOTARY_API_KEY:-}" ]; then
            echo "::warning::NOTARY_API_KEY secret is not set. Skipping notarization."
            exit 0
          fi
          ZIP_PATH="$RUNNER_TEMP/SymairaHub.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "${NOTARY_API_KEY_ID}" \
            --team-id "${NOTARY_API_ISSUER}" \
            --password "${NOTARY_API_KEY}" \
            --wait
          xcrun stapler staple "$APP_PATH"

      - name: Verify bundle version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_PATH=$(find build/release/export -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found for version verification."
            exit 1
          fi
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")
          if [ "$BUNDLE_VERSION" != "$VERSION" ]; then
            echo "::error::Bundle CFBundleShortVersionString is $BUNDLE_VERSION, expected $VERSION."
            exit 1
          fi
          echo "Verified bundle version: $BUNDLE_VERSION"

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP_PATH=$(find build/release/export -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found for DMG creation."
            exit 1
          fi
          hdiutil create -volname "SymairaHub" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "build/release/SymairaHub-${VERSION}.dmg"

      - name: Create GitHub Release and upload DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          DMG_PATH="build/release/SymairaHub-${VERSION}.dmg"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading DMG asset."
            gh release upload "$TAG" \
              "${DMG_PATH}#SymairaHub-${VERSION}.dmg" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              "${DMG_PATH}#SymairaHub-${VERSION}.dmg" \
              --title "$TAG" \
              --generate-notes
          fi

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
