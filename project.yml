name: SymairaHub
options:
  bundleIdPrefix: dev.symaira
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SymairaAppKit:
    url: https://github.com/danieljustus/symaira-appkit
    exactVersion: 0.7.0
  # Feature modules pinned to release tags (Module Integration Contract).
  # Both tool repos expose root-level packages (mirrors of client/) so SPM
  # can resolve them by tag. Local dev may override with a path: dependency
  # and the Modules/ symlinks (gitignored) when working on a module.
  SymscopeClient:
    url: https://github.com/danieljustus/symaira-scope
    exactVersion: 0.4.0
  SymseekClient:
    url: https://github.com/danieljustus/symaira-seek
    exactVersion: 2.5.0

targets:
  SymairaHub:
    type: application
    platform: macOS
    deploymentTarget:
      macOS: "14.0"
    dependencies:
      - package: SymairaAppKit
        product: SymairaTheme
      - package: SymairaAppKit
        product: SymairaToolKit
      - package: SymairaAppKit
        product: SymairaUpdateCheck
      - package: SymscopeClient
        product: SymscopeFeature
      - package: SymseekClient
        product: SymseekFeature
    sources:
      - path: Sources/HubApp
    entitlements:
      path: SymairaHub.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.symaira.SymairaHub
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Symaira Hub
        INFOPLIST_KEY_CFBundleName: Symaira Hub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SymairaHubTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget:
      macOS: "14.0"
    sources:
      - path: Tests/SymairaHubTests
    dependencies:
      - target: SymairaHub
      - package: SymairaAppKit
        product: SymairaCLIRunner
      - package: SymairaAppKit
        product: SymairaToolKit
      - package: SymscopeClient
        product: SymscopeFeature
      - package: SymseekClient
        product: SymseekFeature
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.symaira.SymairaHubTests

schemes:
  SymairaHub:
    build:
      targets:
        SymairaHub: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SymairaHubTests
